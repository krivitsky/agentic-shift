<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,800;1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;color:#05090D;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kicker{font-size:42px;font-weight:800;color:#0E7A55;letter-spacing:.1em;text-transform:uppercase;margin-bottom:56px;margin-top:-56px}
h1{font-size:150px;line-height:1;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.mark{position:relative;width:760px;height:56px;margin-top:44px}.mark .t{position:absolute;left:0;right:0;top:19px;height:18px;border-radius:9px;background:#E3E7E5}.mark .f{position:absolute;left:0;top:19px;height:18px;width:80%;border-radius:9px;background:#3DDC9A}.mark .k{position:absolute;left:calc(80% - 13px);top:0;width:26px;height:56px;border-radius:5px;background:#05090D}
.foot{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:28px;font-weight:500;color:#5B6670}
</style></head><body>
<div class="kicker">Staying sane in the AI race</div>
<h1>Agentic Shift</h1>
<div class="mark"><div class="t"></div><div class="f"></div><div class="k"></div></div>
<div class="foot">agenticshift.org</div>
</body></html>
