<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,800;1,500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#fff;color:#05090D;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.pad{position:absolute;left:72px;top:64px;right:72px}

.row{position:absolute;right:72px;top:132px;width:460px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;color:#5B6670;white-space:nowrap}
.lbl b{font-size:25px;color:#0E7A55;font-weight:800}

.r2{top:222px}.r3{top:312px}

<div class="row r3"><div class="lbl"><span>counting output</span><b>owning outcomes</b></div><div class="track"><div class="fill"></div><div class="cap"></div></div></div>
<div class="foot">agentic-shift.com</div>
