<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shift sliders</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,800;1,500&display=swap" rel="stylesheet">
<style>
.th-dark{--bg:#05090D;--text:#EDF1EF;--accent:#3DDC9A;--fill:#3DDC9A;--amber:#E8A33D;--muted:#9AA4AC;--line:#2A333A;--panel:#1C2329}
.th-light{--bg:#FFFFFF;--text:#05090D;--accent:#0E7A55;--fill:#3DDC9A;--amber:#E8A33D;--muted:#5B6670;--line:#E3E7E5;--panel:#F4F6F5}
.th-auto{--bg:#05090D;--text:#EDF1EF;--accent:#3DDC9A;--fill:#3DDC9A;--amber:#E8A33D;--muted:#9AA4AC;--line:#2A333A;--panel:#1C2329}
@media (prefers-color-scheme: light){.th-auto{--bg:#FFFFFF;--text:#05090D;--accent:#0E7A55;--fill:#3DDC9A;--amber:#E8A33D;--muted:#5B6670;--line:#E3E7E5;--panel:#F4F6F5}}
body{margin:0}
button{font-family:inherit}
.wrap{box-sizing:border-box;padding-left:max(16px,calc((100% - 1200px)/2));padding-right:max(16px,calc((100% - 1200px)/2))}
.txt{overflow-wrap:anywhere;hyphens:none}
.hit{-webkit-appearance:none;appearance:none;position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:grab;z-index:2;background:transparent;touch-action:pan-y}
.hit:active{cursor:grabbing}
.hit::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:36px;height:64px}
.hit::-moz-range-thumb{width:36px;height:64px;border:none}
.hit:focus-visible + .cap{outline:3px solid var(--accent);outline-offset:4px}
.cap{box-shadow:0 3px 0 var(--muted),0 6px 8px rgba(0,0,0,0.35);transition:left .5s ease,transform .15s ease,box-shadow .15s ease}
.cap.travel{transition:left 1.5s cubic-bezier(.22,.8,.2,1),transform .15s ease,box-shadow .15s ease}
.cap.drag{transition:transform .15s ease,box-shadow .15s ease;transform:scale(1.12);box-shadow:0 0 0 4px var(--accent),0 10px 14px rgba(0,0,0,0.35)}
.bar{transition:width .5s ease}
.bar.travel{transition:width 1.5s cubic-bezier(.22,.8,.2,1)}
.bar.drag{transition:none}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.cap,.cap.travel,.bar,.bar.travel{transition:none}}
</style>
</helmet>
<div class="th-{{theme}}" style="width: 100%; background: var(--bg); color: var(--text); font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;">

<div style="background: var(--fill); color: #05090D;">
<div class="wrap" style="padding-top: 40px; padding-bottom: 40px;">
<h2 class="txt" style="margin: 0; font-size: clamp(52px, 11vw, 144px); line-height: 0.9; font-weight: 800; letter-spacing: -0.045em;">Own your shift</h2>
</div>
</div>

<div class="wrap" style="padding-top: 40px; padding-bottom: 8px;">
<ul style="list-style: none; margin: 0; padding: 0; border-bottom: 2px solid var(--line);">
<sc-for list="{{shifts}}" as="s" hint-placeholder-count="6">
<li class="shiftrow" data-i="{{s.i}}" style="border-top: 2px solid var(--line); padding: 28px 0; display: flex; flex-wrap: wrap; gap: 20px 56px; align-items: flex-start;">

<div style="flex: 1 1 560px; min-width: 0;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 6px 16px;">
<div class="txt" style="min-width: 0; max-width: 100%; font-size: clamp(15px, calc(14.56px + 0.112vw), 16px); line-height: 1.2; font-weight: 400; color: var(--muted);">{{s.from}}</div>
<div class="txt" style="min-width: 0; max-width: 100%; margin-left: auto; text-align: right; font-size: clamp(20px, calc(18.25px + 0.449vw), 24px); line-height: 1.15; font-weight: 800; color: var(--accent); letter-spacing: -0.02em;">{{s.to}}</div>
</div>

<div style="position: relative; height: 64px; margin-top: 16px;">
<div style="position: absolute; left: 0; right: 0; top: 9px; height: 6px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 20px);"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 9px; height: 6px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 20px);"></div>
<div style="position: absolute; left: 0; right: 0; top: 28px; height: 8px; border-radius: 4px; background: var(--line);"></div>
<div class="bar {{s.cls}}" style="position: absolute; left: 0; top: 28px; height: 8px; border-radius: 4px; background: var(--fill); width: {{s.fillW}};"></div>
<input class="hit" type="range" min="0" max="100" step="1" value="{{s.value}}" onChange="{{s.onChange}}" onPointerDown="{{s.down}}" aria-label="{{s.title}}">
<div class="cap {{s.cls}}" style="position: absolute; top: 6px; width: 36px; height: 52px; box-sizing: border-box; border-radius: 4px; background: var(--text); pointer-events: none; left: {{s.capLeft}};">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 4px; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 5px);"></div>
<div style="position: absolute; left: 16px; top: 5px; bottom: 5px; width: 4px; border-radius: 2px; background: var(--bg);"></div>
</div>
</div>
</div>

<div class="txt" style="flex: 0 1 520px; min-width: 0; max-width: 72ch; font-size: clamp(16px, calc(15.56px + 0.112vw), 17px); line-height: 1.5; color: var(--text);">{{s.note}}</div>

</li>
</sc-for>
</ul>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["start","live","travel","drag"],"default":"start"},"theme":{"editor":"enum","options":["dark","light","auto"],"default":"dark"},"stress":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":2000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.played = [false, false, false, false, false, false];
this.touched = [false, false, false, false, false, false];
this.epoch = 0;
this.state = this.initial(props.mode);
if (props.mode === 'live' && this.reduced()) this.played = [true, true, true, true, true, true];
}
reduced() {
try {
return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
} catch (e) {
return false;
}
}
initial(mode) {
const sample = [70, 45, 60, 85, 30, 55];
let v = [0, 0, 0, 0, 0, 0];
let drag = -1;
if (mode === 'travel') v = [95, 95, 55, 23, 0, 0];
if (mode === 'sample') v = sample.slice();
if (mode === 'drag') { v = sample.slice(); v[2] = 38; drag = 2; }
if (mode === 'live' && this.reduced()) v = [95, 95, 95, 95, 95, 95];
return { v: v, drag: drag, travel: [false, false, false, false, false, false] };
}
componentDidMount() {
this.up = () => {
if (this.props.mode !== 'drag' && this.state.drag >= 0) this.setState({ drag: -1 });
};
document.addEventListener('pointerup', this.up);
document.addEventListener('pointercancel', this.up);
this.observe();
}
componentDidUpdate(prev) {
if (prev.mode !== this.props.mode) {
this.played = [false, false, false, false, false, false];
this.touched = [false, false, false, false, false, false];
this.epoch++;
this.setState(this.initial(this.props.mode));
this.observe();
}
}
componentWillUnmount() {
document.removeEventListener('pointerup', this.up);
document.removeEventListener('pointercancel', this.up);
if (this.io) this.io.disconnect();
}
observe() {
if (this.io) { this.io.disconnect(); this.io = null; }
if (this.props.mode !== 'live' || this.reduced()) return;
const rows = Array.prototype.slice.call(document.querySelectorAll('.shiftrow'));
const run = (idxs) => {
const ep = this.epoch;
idxs.forEach((i, j) => {
setTimeout(() => { if (ep === this.epoch) this.travelRow(i); }, j * 200);
});
};
if (typeof IntersectionObserver === 'undefined') {
run(rows.map((r, i) => i));
return;
}
this.io = new IntersectionObserver((entries) => {
const idxs = [];
entries.forEach((e) => {
if (e.isIntersecting) {
const i = Number(e.target.getAttribute('data-i'));
if (!this.played[i]) { this.played[i] = true; idxs.push(i); }
this.io.unobserve(e.target);
}
});
idxs.sort((a, b) => a - b);
run(idxs);
}, { threshold: 0.5 });
rows.forEach((r) => this.io.observe(r));
}
travelRow(i) {
if (this.touched[i]) return;
const v = this.state.v.slice();
const t = this.state.travel.slice();
v[i] = 95;
t[i] = true;
this.setState({ v: v, travel: t });
setTimeout(() => {
const t2 = this.state.travel.slice();
t2[i] = false;
this.setState({ travel: t2 });
}, 1700);
}
setV(i, val) {
this.touched[i] = true;
this.played[i] = true;
const v = this.state.v.slice();
const t = this.state.travel.slice();
v[i] = Number(val);
t[i] = false;
this.setState({ v: v, travel: t });
}
renderVals() {
const v = this.state.v;
const drag = this.state.drag;
const travel = this.state.travel;
const stress = this.props.stress === true || this.props.stress === 'true';
const en = [
['narrow specialists', 'complete craftspeople', 'Enabling product engineers to shift from narrow, assembly-line specialists to end-to-end craftspeople — with AI filling the specialist gaps and offering upskilling for entering new domains.'],
['coordinating dependencies', 'extreme cocreation', 'Instead of coordinating fragments through handoffs and integration meetings, complete craftspeople work in flow with their agents and with each other, alternating between focused work and looking at the whole product together, improving it as a whole.'],
['coding features', 'designing agentic systems', 'Moving product engineers from coding features one by one to designing the agentic systems that build them — self-improving loops that turn intent into tested, working software and verify every change against tests and specs, while product engineers own the tests and the value loop.'],
['the telephone game', 'zero distance to users', 'Ending the telephone game through manager-proxies and the era of "IT sitting in the basement" — instead putting product engineers at zero distance with the customers and users, to empathize, analyze, and synthesize firsthand.'],
['counting output', 'owning outcomes', 'Elevating product engineers from counting output to owning the complete value loop — ensuring real customer impact, experimenting and course-correcting as the evidence comes in.'],
['work follows people', 'people follow value', 'Organizing around value instead of around existing roles and team boundaries — product engineers move to where the most valuable work is as priorities shift, which keeps the whole organization adaptable.']
];
const de = [
['enge Spezialisten', 'ganzheitliche Handwerkerinnen und Handwerker'],
['Abhängigkeiten koordinieren', 'extreme Zusammenarbeit über Teamgrenzen hinweg'],
['Features programmieren', 'selbstverifizierende agentische Systeme entwerfen'],
['Stille Post', 'null Distanz zu den Nutzerinnen und Nutzern'],
['Output zählen', 'Verantwortung für Ergebnisse übernehmen'],
['Arbeit folgt den Menschen', 'Menschen folgen dem Wert']
];
const shifts = en.map((r, i) => {
const from = stress ? de[i][0] : r[0];
const to = stress ? de[i][1] : r[1];
const f = v[i] / 100;
const cls = (drag === i ? 'drag' : '') + (travel[i] ? ' travel' : '');
return {
i: i,
from: from,
to: to,
note: r[2],
title: from + ' → ' + to,
value: v[i],
capLeft: 'calc((100% - 36px) * ' + f + ')',
fillW: 'calc((100% - 36px) * ' + f + ' + 18px)',
cls: cls,
onChange: (e) => this.setV(i, e.target.value),
down: () => {
this.touched[i] = true;
this.played[i] = true;
const t = this.state.travel.slice();
t[i] = false;
this.setState({ drag: i, travel: t });
}
};
});
const settle = () => {
this.epoch++;
this.played = [true, true, true, true, true, true];
this.touched = [true, true, true, true, true, true];
};
return {
theme: this.props.theme ?? 'dark',
shifts: shifts,
sample: () => { settle(); this.setState({ v: this.initial('sample').v, drag: -1, travel: [false, false, false, false, false, false] }); },
reset: () => { settle(); this.setState({ v: [0, 0, 0, 0, 0, 0], drag: -1, travel: [false, false, false, false, false, false] }); }
};
}
}
</script>
</body>
</html>
